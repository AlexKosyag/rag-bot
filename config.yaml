# Конфигурация RAG-бота. Документация: docs/architecture.md
models:
  # Бэкенд эмбеддингов: ollama (когда Hugging Face недоступен) либо
  # sentence_transformers (основной, напр. intfloat/multilingual-e5-base)
  embedding_backend: ollama
  embedding: qwen3-embedding:0.6b    # ST-вариант: intfloat/multilingual-e5-base
  llm: qwen2.5:7b                    # Ollama tag; CPU-fallback: qwen2.5:3b
  device: cpu                        # только для sentence_transformers: cpu | cuda

retrieval:
  top_k: 5                 # 3..10, правится в админке
  threshold: 0.44          # порог отказа tau (откалиброван на scale-dev: hybrid, 60 вопросов)
  delta: 0.05              # мин. разрыв top1-top2 (низкий -> осторожный ответ)
  hybrid: true             # RRF-слияние векторного и BM25-поиска (FTS5)
  rrf_k: 60                # константа Reciprocal Rank Fusion
  reranker: heuristic      # off | heuristic | cross_encoder (bge-reranker-v2-m3)

chunking:
  size_tokens: 500
  overlap_tokens: 50
  min_tokens: 50

generation:
  temperature: 0.2
  max_tokens: 700
  timeout_s: 600          # CPU-only: 7B даёт ~6.5 tok/s, длинный ответ может идти минутами

agentic:
  enabled: true           # агентный поиск: LLM вызывает search_documents поверх seed-ретрива
  max_tool_calls: 3       # максимум вызовов инструмента за диалог (плюс seed всегда)
  rewrite: true           # query rewriting с учётом истории диалога

paths:
  raw_dir: data/raw
  chroma_dir: data/chroma
  registry_db: data/registry.db
  reports_dir: reports
  qa_dir: data/qa
